# Server Configuration
server.port=8080
server.servlet.context-path=

# Database Configuration (MySQL)
# Default values for local development with environment variable overrides
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:contactdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
# WARNING: 'update' is recommended ONLY for local rapid development.
# For production environments, set this to 'validate' or 'none' and apply schema migrations using Flyway or Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Session & Security Cookie Configuration
server.servlet.session.cookie.name=CONTACT_SESSION_ID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# In production under HTTPS, set server.servlet.session.cookie.secure=true via SERVER_SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.secure=${SERVER_SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=2h

# Optional Sample Seed Data (disabled by default)
app.seed.enabled=false
